<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Weather Station</title>

    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>The Weather Station</h1>
        <div id="div-header-image">
            <div class="image-wrapper">
                <img src="../media/ws-phone-test.jpg" alt="">
            </div>
        </div>
    </header>

    <main>
        <section id="data-now">
            <div id="data-now-date-time">
                Date, Time
            </div>
            <div id="data-now-data">
                <div class="data-now-data-inner">
                    <span class="data-now-headline">temperature</span>
                    <span id="data-now-temperature">N/A °C</span>
                </div>
                <div class="data-now-data-inner">
                    <span class="data-now-headline">humidity</span>
                    <span id="data-now-humidity">N/A %</span>
                </div>
                <div class="data-now-data-inner">
                    <span class="data-now-headline">PM 2.5</span>
                    <span id="data-now-pm25">N/A ug/m3</span>
                </div>
                <div class="data-now-data-inner">
                    <span class="data-now-headline">CO₂</span>
                    <span id="data-now-co2">N/A ppm</span>
                </div>
                <div class="data-now-data-inner">
                    <span class="data-now-headline">gas resistance</span>
                    <span id="data-now-gas-resistance">N/A kOhm</span>
                </div>
                <div class="data-now-data-inner">
                    <span class="data-now-headline">air pressure</span>
                    <span id="data-now-air-pressure">N/A hppa</span>
                </div>
            </div>
        </section>

        <section id="graphs">
            <div> --- GRAPHS HERE --- </div>
        </section>

        <section id="data-past">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Time</th>
                        <th>Temperature</th>
                        <th>Humidity</th>
                        <th>PM2.5</th>
                        <th>CO₂</th>
                        <th>Gas Resistance</th>
                    </tr>
                </thead>

                <tbody id="weather-data-body">
                    <!-- JavaScript inserts rows here -->
                </tbody>
            </table>
        </section>

    </main>

    <script src="./index.js"></script>
</body>

</html>
